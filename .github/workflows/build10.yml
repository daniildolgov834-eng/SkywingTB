name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev aidl libstdc++6
          pip3 install --user --upgrade buildozer cython virtualenv
          
      - name: Setup Swap
        run: |
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          
      - name: Manually install build-tools and Aidl
        run: |
          # Создаем папку build-tools, куда Buildozer смотрит по умолчанию
          mkdir -p ~/.buildozer/android/platform/android-sdk/build-tools/33.0.2
          
          # Копируем установленный системный aidl в папку build-tools
          # Это обходит проверку лицензий Buildozer
          cp /usr/bin/aidl ~/.buildozer/android/platform/android-sdk/build-tools/33.0.2/
          chmod 777 ~/.buildozer/android/platform/android-sdk/build-tools/33.0.2/aidl
          
      - name: Build with Buildozer
        run: |
          export PATH=$PATH:~/.local/bin
          export MAKEFLAGS="-j1"
          yes | buildozer -v android debug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
